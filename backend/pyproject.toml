[project]
name = "freelance-autopilot-backend"
version = "0.1.0"
description = "Freelance Autopilot backend: Engagement Record schema, persistence store, and Strands/Bedrock orchestration."
requires-python = ">=3.10"
dependencies = [
    "strands-agents==1.54.0",
    "pydantic>=2.13,<3",
    "boto3>=1.43,<2",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
# Phase 8's cut-first stretch. An extra, never a dependency: the local path is
# required to keep working with this uninstalled (SC3), which
# tests/test_store_factory.py enforces in an import-blocked subprocess.
agentcore = [
    "bedrock-agentcore[strands-agents]>=1.23,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
