[project]
name = "freelance-autopilot-backend"
version = "0.1.0"
description = "Freelance Autopilot backend: Engagement Record schema, persistence store, and Strands/Bedrock orchestration."
requires-python = ">=3.10"
dependencies = [
    "strands-agents==1.54.0",
    "pydantic>=2.13,<3",
    "boto3>=1.43,<2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
